[project]
name = "fastapi-mon"
version = "0.1.0"
description = "轻量级机器监控系统：FastAPI 管理端 + Python 容器化客户端"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["server", "agent"]

[tool.uv.sources]
mon-server = { workspace = true }
mon-agent = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
