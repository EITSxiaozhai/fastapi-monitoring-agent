[project]
name = "mon-agent"
version = "0.1.0"
description = "机器监控客户端 (采集并上报机器指标)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psutil>=6.0.0",
    "websockets>=13.0",
]

[project.scripts]
mon-agent = "agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
